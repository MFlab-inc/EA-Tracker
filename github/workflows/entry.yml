name: Process Inbox Entry

on:
  push:
    branches: [main]
    paths: ['inbox/**']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: inbox-processing
  cancel-in-progress: false

jobs:
  process:
    # botの自己コミット(inboxリセット)での再トリガーを防止
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Process inbox entries
        run: node scripts/process-inbox.js

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ inbox/
          if git diff --cached --quiet; then
            echo "変更なし(記入済みinboxなし)"
          else
            MSG="記録更新"
            if [ -f .commit-message ]; then MSG="$(cat .commit-message)"; rm .commit-message; fi
            git commit -m "$MSG"
            git push
          fi
